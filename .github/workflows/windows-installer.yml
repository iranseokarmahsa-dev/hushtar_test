name: Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: true
        default: "1.0.2"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Windows packaging tools
        run: choco install innosetup --no-progress -y
      - name: Install Graphviz
        run: choco install graphviz --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:APP_VERSION
          if (-not $version) { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          .\scripts\build_installer.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: HOOSHYAR-Setup
          path: installer-output/HOOSHYAR-Setup.exe
          if-no-files-found: error
