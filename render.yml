services:
  - type: web
    name: analyzaer
    env: python
    region: oregon # یا هر ریجنی که انتخاب کرده‌اید
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
