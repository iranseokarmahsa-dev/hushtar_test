<div id="axial-save-status" class="alert" role="status" aria-live="polite" hidden></div>
<script>
(function () {
	const status = document.getElementById('axial-save-status');
	if (!status) return;
	let timer = null;
	function show(text, kind) {
		status.hidden = false;
		status.textContent = text;
		status.className = 'alert ' + (kind === 'error' ? 'alert-warning' : 'alert-success');
	}
	function save(form) {
		show('در حال ذخیره...', 'saving');
		fetch(form.action, {
			method: 'POST',
			body: new FormData(form),
			headers: {'X-Requested-With': 'XMLHttpRequest'}
		}).then(response => {
			if (!response.ok) throw new Error('HTTP ' + response.status);
			show('ذخیره شد', 'success');
		}).catch(() => show('ذخیره ناموفق؛ اطلاعات واردشده حفظ شده است.', 'error'));
	}
	document.querySelectorAll('form[data-autosave]').forEach(form => {
		form.addEventListener('input', () => {
			show('تغییرات ذخیره‌نشده', 'saving');
			clearTimeout(timer);
			timer = setTimeout(() => save(form), 1200);
		});
	});
})();
</script>
